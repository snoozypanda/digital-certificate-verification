<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1B2A4A;
    --parchment: #FAF6EC;
    --parchment-deep: #F1EADA;
    --brass: #A9812E;
    --brass-light: #C9A24E;
    --verified: #33513F;
    --revoked: #8C3B2E;
    --line: #D9CFB8;
    --shadow: rgba(27, 42, 74, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--parchment);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(169,129,46,0.06), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(27,42,74,0.05), transparent 45%);
    font-family: 'IBM Plex Sans', sans-serif;
    color: var(--ink);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 6vh 20px;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 20px 40px var(--shadow);
    overflow: hidden;
  }

  .card-header {
    padding: 36px 40px 28px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 10px 0 0;
    font-size: 14.5px;
    color: #5b6270;
  }

  .form-area {
    padding: 28px 40px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  #cert-input {
    flex: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    background: var(--parchment);
    color: var(--ink);
    text-transform: uppercase;
  }

  #cert-input:focus {
    outline: none;
    border-color: var(--brass);
    box-shadow: 0 0 0 3px rgba(169,129,46,0.15);
  }

  #cert-input::placeholder {
    text-transform: none;
    color: #a3a8b3;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    border-radius: 3px;
    padding: 0 22px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover { background: #263a63; }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button:disabled { opacity: 0.5; cursor: default; }

  .hint {
    margin: 10px 2px 0;
    font-size: 12.5px;
    color: #8a8f99;
  }

  .result-area {
    padding: 0 40px 40px;
  }

  .result-area:empty { display: none; }

  .seal-wrap {
    display: flex;
    justify-content: center;
    margin: 6px 0 22px;
  }

  .seal {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: stamp 0.5s cubic-bezier(0.2, 1.4, 0.4, 1) both;
  }

  .seal.verified {
    background: radial-gradient(circle at 35% 30%, #3d6350, var(--verified));
    box-shadow: 0 8px 20px rgba(51,81,63,0.35), inset 0 0 0 3px rgba(255,255,255,0.15);
  }

  .seal.revoked {
    background: radial-gradient(circle at 35% 30%, #a15142, var(--revoked));
    box-shadow: 0 8px 20px rgba(140,59,46,0.3), inset 0 0 0 3px rgba(255,255,255,0.1);
    opacity: 0.85;
  }

  .seal svg { width: 42px; height: 42px; }

  @keyframes stamp {
    0% { transform: scale(1.6) rotate(-8deg); opacity: 0; }
    60% { transform: scale(0.94) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .seal { animation: none; }
  }

  .status-line {
    text-align: center;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 24px;
  }

  .status-line.verified { color: var(--verified); }
  .status-line.revoked { color: var(--revoked); }

  .detail-list {
    border-top: 1px solid var(--line);
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14.5px;
  }

  .detail-label {
    color: #6b7280;
    flex-shrink: 0;
  }

  .detail-value {
    text-align: right;
    font-weight: 500;
  }

  .detail-value.mono {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
  }

  .error-box {
    text-align: center;
    padding: 28px 10px 6px;
  }

  .error-box p {
    font-size: 14.5px;
    color: #5b6270;
    margin: 4px 0 0;
  }

  .loading {
    text-align: center;
    padding: 32px 0 6px;
    font-size: 14px;
    color: #8a8f99;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: #a3a8b3;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div style="width:100%; max-width:560px; margin:0 auto;">
  <div class="card">
    <div class="card-header">
      <p class="eyebrow">Certificate Registry</p>
      <h1>Verify a Certificate</h1>
      <p class="subtitle">Enter the certificate ID printed on the document or found in the QR code.</p>
    </div>

    <div class="form-area">
      <form id="verify-form">
        <div class="input-row">
          <input
            id="cert-input"
            type="text"
            placeholder="e.g. CERT-2026-A1B2C3"
            autocomplete="off"
            spellcheck="false"
            aria-label="Certificate ID"
          />
          <button type="submit" id="verify-btn">Verify</button>
        </div>
        <p class="hint">Certificate IDs are not case-sensitive.</p>
      </form>
    </div>

    <div class="result-area" id="result-area"></div>
  </div>

  <footer></footer>
</div>

<script>
  // API_BASE automatically matches the server hosting this page.
  // When served from the backend (e.g. http://10.1.10.35:8000), API calls go to the backend.
  // When served from Vercel, set PROD_BACKEND_URL to your production backend address.
  const PROD_BACKEND_URL = "https://frontend-nu-woad-19.vercel.app";

  const API_BASE = (
    window.location.origin.includes("vercel.app")
  )
    ? PROD_BACKEND_URL
    : window.location.origin;

  const form = document.getElementById('verify-form');
  const input = document.getElementById('cert-input');
  const button = document.getElementById('verify-btn');
  const resultArea = document.getElementById('result-area');

  // Auto-fill from ?id= query param (what a QR code link would carry)
  const params = new URLSearchParams(window.location.search);
  const prefilled = params.get('id');
  if (prefilled) {
    input.value = prefilled;
    verify(prefilled);
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const id = input.value.trim();
    if (id) verify(id);
  });

  async function verify(certId) {
    button.disabled = true;
    resultArea.innerHTML = `<div class="loading">Checking registry…</div>`;

    try {
      const res = await fetch(`${API_BASE}/verify/${encodeURIComponent(certId)}`);

      if (res.status === 404) {
        renderNotFound(certId);
        return;
      }
      if (!res.ok) {
        renderError();
        return;
      }

      const data = await res.json();
      renderResult(data);
    } catch (err) {
      renderError();
    } finally {
      button.disabled = false;
    }
  }

  function renderResult(data) {
    // Adjust these field names to match your actual API response shape.
    const isValid = data.valid !== false && data.status !== 'revoked';
    const sealClass = isValid ? 'verified' : 'revoked';
    const statusText = isValid ? 'Certificate Verified' : 'Certificate Not Valid';

    const checkIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#FAF6EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
    const xIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#FAF6EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>`;

    resultArea.innerHTML = `
      <div class="seal-wrap"><div class="seal ${sealClass}">${isValid ? checkIcon : xIcon}</div></div>
      <p class="status-line ${sealClass}">${statusText}</p>
      <div class="detail-list">
        ${row('Recipient', data.recipient_name)}
        ${row('Certificate', data.certificate_title)}
        ${row('Issued by', data.organization_name)}
        ${row('Issue date', data.issue_date)}
        ${row('Certificate ID', data.certificate_id, true)}
      </div>
    `;
  }

  function row(label, value, mono) {
    if (!value) return '';
    return `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value${mono ? ' mono' : ''}">${escapeHtml(value)}</span></div>`;
  }

  function renderNotFound(certId) {
    resultArea.innerHTML = `
      <div class="seal-wrap"><div class="seal revoked"><svg viewBox="0 0 24 24" fill="none" stroke="#FAF6EC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></div></div>
      <p class="status-line revoked">Certificate Not Found</p>
      <div class="error-box"><p>No certificate matches ID "${escapeHtml(certId)}". Check for typos and try again.</p></div>
    `;
  }

  function renderError() {
    resultArea.innerHTML = `
      <div class="error-box"><p>Something went wrong reaching the registry. Please try again in a moment.</p></div>
    `;
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
